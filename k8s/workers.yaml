apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-worker
spec:
  replicas: 3
  selector:
    matchLabels: { app: scheduler-worker }
  template:
    metadata:
      labels: { app: scheduler-worker }
    spec:
      containers:
        - name: worker
          image: distributed-scheduler-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: WORKER_ADVERTISE_URL
              value: http://$(POD_IP):6001
            - name: PORT
              value: "6001"
            - name: SCHEDULER_URL
              value: http://scheduler-backend:5000/api
          ports: [{ containerPort: 6001 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 6001 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 6001 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-worker
spec:
  selector: { app: scheduler-worker }
  ports: [{ port: 6001, targetPort: 6001 }]