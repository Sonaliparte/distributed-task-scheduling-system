services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 5000
      TASK_MAX_RETRIES: ${TASK_MAX_RETRIES:-3}
      WORKER_HEARTBEAT_TIMEOUT_MS: ${WORKER_HEARTBEAT_TIMEOUT_MS:-10000}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [scheduler]

  worker-01:
    build:
      context: ./workers
      dockerfile: Dockerfile
    environment:
      WORKER_ID: worker-01
      PORT: 6001
      SCHEDULER_URL: http://backend:5000/api
      WORKER_CPU: 4
      WORKER_MEMORY: 8192
      WORKER_ADVERTISE_URL: http://worker-01:6001
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [scheduler]

  worker-02:
    build:
      context: ./workers
      dockerfile: Dockerfile
    environment:
      WORKER_ID: worker-02
      PORT: 6002
      SCHEDULER_URL: http://backend:5000/api
      WORKER_CPU: 4
      WORKER_MEMORY: 8192
      WORKER_ADVERTISE_URL: http://worker-02:6002
    depends_on:
      backend:
        condition: service_healthy
    networks: [scheduler]

networks:
  scheduler: