apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: scheduler-backend }
  template:
    metadata:
      labels: { app: scheduler-backend }
    spec:
      containers:
        - name: backend
          image: distributed-scheduler-backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          env:
            - name: PORT
              value: "5000"
            - name: TASK_MAX_RETRIES
              value: "3"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-backend
spec:
  selector: { app: scheduler-backend }
  ports: [{ port: 5000, targetPort: 5000 }]